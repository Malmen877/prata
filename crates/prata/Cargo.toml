[package]
name = "prata"
description = "Swedish speech-to-text CLI (KBLab kb-whisper models on Hugging Face Candle)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "prata"
path = "src/main.rs"

[dependencies]
anyhow = "1"
byteorder = "1.4"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hf-hub = { version = "1.0.0", features = ["blocking"] }
serde_json = "1"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
accelerate-src = { version = "0.3.2", optional = true }

[features]
default = []
# Apple GPU (macOS). Used for the darwin-arm64 release build.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
accelerate = ["dep:accelerate-src", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
